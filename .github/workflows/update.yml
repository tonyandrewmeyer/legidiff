# Nightly: commit whatever the PCO published today.
#
# The generated repository is not this one -- it lives at ${{ vars.NZ_ACTS_REPO }}
# (default tonyandrewmeyer/nz-acts), which this workflow clones, adds to and
# pushes back. It must already exist and hold the initial corpus: the first
# 28,000 commits are pushed by hand from a machine that has the cache, not
# built here.
#
# State (which Act was built at which sitemap lastmod) rides along on an
# orphan `state` branch of that same repository, force-pushed as a single
# commit each night so it never accumulates history.
name: update

on:
  # Disabled until legidiff reads from api.legislation.govt.nz: the website
  # answers a datacentre IP with 202 and x-amzn-waf-action: challenge, so a
  # scheduled run from a GitHub runner cannot fetch anything and would only
  # fail every morning. Restore this line once the API port lands.
  # schedule:
  #   - cron: "0 19 * * *" # 07:00 NZST / 08:00 NZDT, after the overnight publish
  workflow_dispatch:
    inputs:
      sweep:
        description: "Ask every Act, ignoring the sitemap lastmod filter (hours)"
        type: boolean
        default: false
      limit:
        description: "Stop after N Acts"
        type: string
        default: ""

permissions: {}

concurrency:
  group: update
  cancel-in-progress: false

env:
  TARGET: ${{ vars.NZ_ACTS_REPO || 'tonyandrewmeyer/nz-acts' }}

jobs:
  update:
    runs-on: ubuntu-latest
    # NZ_ACTS_TOKEN lives in this environment, not in the repository's own
    # secrets, so a branch policy can keep it to the default branch.
    environment: nz-acts
    # A sweep asks 14,591 Acts at one request a second.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Clone the generated repository
        env:
          TOKEN: ${{ secrets.NZ_ACTS_TOKEN }}
        run: |
          git clone --no-tags "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" out/nz-acts
          git -C out/nz-acts log --oneline -1

      - name: Restore the build state
        run: |
          mkdir -p cache
          if git -C out/nz-acts fetch --depth 1 origin state 2>/dev/null; then
            git -C out/nz-acts show FETCH_HEAD:corpus.json.gz > cache/corpus.json.gz
            gunzip -f cache/corpus.json.gz
            python3 -c "import json;print(len(json.load(open('cache/corpus.json'))['acts']), 'Acts in state')"
          else
            echo "No state branch yet: this run will ask every Act."
          fi

      - name: Update
        env:
          SWEEP: ${{ inputs.sweep }}
          LIMIT: ${{ inputs.limit }}
        run: |
          # The default shell is bash -e, so these are `if` blocks rather
          # than `&&` chains, which would fail the step when the test fails.
          args=()
          if [ "$SWEEP" = "true" ]; then
            args+=(--sweep)
          fi
          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi
          python3 -m legidiff update --repo out/nz-acts "${args[@]}" 2>&1 | tee update.log

      - name: Push new commits
        run: |
          cd out/nz-acts
          if [ -z "$(git log --oneline @{u}..HEAD)" ]; then
            echo "Nothing new to push."
          else
            git log --oneline @{u}..HEAD | head -50
            git push origin HEAD:main
          fi

      - name: Push the build state
        if: always()
        env:
          TOKEN: ${{ secrets.NZ_ACTS_TOKEN }}
        run: |
          [ -f cache/corpus.json ] || exit 0
          rm -rf state && mkdir state
          gzip -9 -c cache/corpus.json > state/corpus.json.gz
          cd state
          git init -q -b state
          git add -A
          git -c user.name=legidiff -c user.email=noreply@legislation.govt.nz \
            commit -q --no-gpg-sign -m "State as at $(date -u +%FT%TZ)"
          git push --force "https://x-access-token:${TOKEN}@github.com/${TARGET}.git" state:state

      - name: Report failures
        if: always()
        run: python3 -m legidiff corpus --failures || true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: update-log
          path: update.log
          if-no-files-found: ignore
