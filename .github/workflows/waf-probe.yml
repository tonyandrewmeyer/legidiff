name: waf-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          probe () {
            echo "--- $1"
            curl -sS -o /dev/null -D - -A "legidiff/0.1 probe" --max-time 60 "$1" \
              | grep -Ei "^HTTP|x-amzn-waf-action|content-length|content-type|location" || true
          }
          probe "https://www.legislation.govt.nz/act/public/1961/43/en/2026-08-08.xml"
          probe "https://www.legislation.govt.nz/act/public/1961/43/en/latest/"
          probe "https://api.legislation.govt.nz/v0/works/?search_term=crimes&legislation_type=act"
          probe "https://api.legislation.govt.nz/docs/"
