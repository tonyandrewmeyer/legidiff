[project]
name = "legidiff"
version = "0.1.0"
description = "Build a git history of New Zealand Acts from the official XML"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
legidiff = "legidiff.cli:main"

[dependency-groups]
lint = [
    "ruff==0.12.4",
    "zizmor==1.26.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Following the Ops style guide: https://github.com/canonical/operator/blob/main/STYLE.md
[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
    "F",    # Pyflakes
    "E",    # Pycodestyle
    "W",
    "I001", # isort
    "N",    # pep8-naming
    "A",    # flake8-builtins
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    "S",    # flake8-bandit
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # Ruff specific
    "PERF", # Perflint
    "D",    # pyflakes-docstrings
]
ignore = [
    "S101", # Use of `assert` detected
    "D105", # Missing docstring in magic method
    "D107", # Missing docstring in `__init__`
    "D203", # 1 blank line required before class docstring
    "D213", # Multi-line docstring summary should start at the second line
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "S603", "S607", "RUF012"]
"tests/fixtures.py" = ["E501"]  # the fixtures are XML, as published
"tests/test_render.py" = ["S314"]

[tool.ruff.lint.pydocstyle]
convention = "google"
